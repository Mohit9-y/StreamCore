# ===============================
# APPLICATION ALIAS
# ===============================
spring.application.name=BingeForge

# ===============================
# DATABASE CONFIGURATION (PostgreSQL/MySQL)
# ===============================
# Change 'postgresql' to 'mysql' and update the port if you are using MySQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bingeforge_db
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

# Hibernate auto-creates and updates your tables based on your Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT SECURITY CONFIGURATION
# ===============================
# Generate a secure 256-bit (32+ character) random string for this secret
jwt.secret=YOUR_SUPER_SECRET_KEY_THAT_IS_AT_LEAST_32_CHARACTERS_LONG
# 86400000 milliseconds = 24 hours
jwt.expiration=86400000

# ===============================
# BACKBLAZE B2 (S3-COMPATIBLE) CONFIGURATION
# ===============================
# Example endpoint: https://s3.us-west-004.backblazeb2.com
b2.endpoint=https://s3..backblazeb2.com
b2.region=
b2.accessKeyId=YOUR_B2_KEY_ID
b2.secretAccessKey=YOUR_B2_APPLICATION_KEY
b2.bucketName=YOUR_BUCKET_NAME

# ===============================
# CLOUDFLARE CDN / STREAMING CONFIGURATION
# ===============================
# The domain where your streaming chunks will be served from
cdn.domain=https://cdn.yourdomain.com

# ===============================
# FILE UPLOAD LIMITS (Spring Boot Defaults)
# ===============================
# Even though clients upload directly to B2, keeping this defined is good practice
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB